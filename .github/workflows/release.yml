name: Release

# Push a tag like v1.1 (matching CFBundleShortVersionString in Resources/Info.plist)
# to build a universal DMG and publish it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Check tag matches app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" Resources/Info.plist)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version"
            exit 1
          fi

      - name: Build DMG
        run: ./build.sh dmg

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/Headroom-*.dmg \
            --title "Headroom ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md
